<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Que15</title>
  </head>
  <body>
    <script>
      // Creating a car object
      let car = {
        brand: "Toyota",
        model: "Corolla",
        year: 2015,
      };

      // Accessing and printing brand and model
      console.log("Brand:", car.brand);
      console.log("Model:", car.model);

      // Updating the year property
      car.year = 2022;
      console.log("Updated Year:", car.year);

      // Adding a new property 'color'
      car.color = "Red";
      console.log("Color:", car.color);

      // Printing the full updated object
      console.log(car);
    </script>
  </body>
</html>
